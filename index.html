<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Archive - Select Mode & Move</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        /* --- 테마 변수 (라이트 모드 기본) --- */
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --border-color: #eeeeee;
            --border-strong: #000000;
            --overlay-bg: rgba(0,0,0,0.5);
            --modal-bg: #ffffff;
            --modal-text: #000000;
            --hover-bg: #f9f9f9;
        }

        /* --- 테마 변수 (다크 모드) --- */
        body.dark-mode {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #666666;
            --border-color: #222222;
            --border-strong: #ffffff;
            --overlay-bg: rgba(255,255,255,0.1);
            --modal-bg: #111111;
            --modal-text: #ffffff;
            --hover-bg: #1a1a1a;
        }

        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- Header --- */
        .header-top { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            margin-bottom: 60px; position: relative; z-index: 10;
        }
        .logo-area h1 { font-size: 32px; font-weight: 600; letter-spacing: -1px; cursor: pointer; text-transform: uppercase; margin: 0; line-height: 1;}
        
        .header-actions { display: flex; gap: 20px; align-items: center; font-size: 14px; text-transform: uppercase; font-weight: 500; flex-wrap: wrap;}
        .header-actions span { cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
        .header-actions span:hover { opacity: 0.6; }
        
        .search-box input { 
            background: transparent; border: none; border-bottom: 1px solid var(--text-muted); 
            color: var(--text-main); padding: 5px 0; font-size: 13px; outline: none; width: 150px;
            font-family: 'Inter', sans-serif; text-transform: uppercase; transition: width 0.3s;
        }
        .search-box input:focus { width: 200px; border-color: var(--text-main); }

        /* =========================================
           필터 영역 (간격 최적화 반영)
           ========================================= */
        .filter-section { margin-bottom: 40px; }
        /* 컬럼 간의 가로 간격을 120px로 여유롭게 */
        .directory-filters { display: flex; gap: 120px; margin-bottom: 30px; font-size: 14px; color: var(--text-muted); }
        .filter-group { display: flex; flex-direction: column; gap: 16px; min-width: 140px; }
        .filter-title { font-weight: 600; color: var(--text-main); text-transform: uppercase; margin-bottom: 4px; }
        
        /* 항목 간의 세로 간격을 좁게 (gap: 2px) 뭉쳐보이게 설정 */
        .filter-list-container { display: flex; flex-direction: column; gap: 2px; }
        .filter-item { cursor: pointer; transition: color 0.2s; line-height: 1.3;}
        .filter-item:hover, .filter-item.active { color: var(--text-main); }

        .active-filters-area { display: flex; gap: 10px; flex-wrap: wrap; min-height: 30px; }
        .active-filter-tag { background-color: var(--text-main); color: var(--bg-color); padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
        .active-filter-tag:hover { opacity: 0.8; transform: scale(0.98); }
        .active-filter-tag .remove-btn { font-size: 10px; font-weight: bold; }
        .active-filter-tag.clear-all { background-color: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
        .active-filter-tag.clear-all:hover { color: var(--text-main); border-color: var(--text-main); background-color: transparent; }

        /* =========================================
           다중 선택 (Bulk Actions) 영역
           ========================================= */
        .grid-controls { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        #selectModeBtn { cursor: pointer; font-size: 13px; font-weight: 600; text-transform: uppercase; transition: opacity 0.2s, color 0.2s; }
        #selectModeBtn:hover { opacity: 0.6; }
        #selectModeBtn.active { color: #007aff; opacity: 1; }

        .bulk-actions { 
            position: sticky; top: 20px; z-index: 100;
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 24px; padding: 14px 20px; 
            background: var(--hover-bg); border: 1px solid var(--border-color); 
            border-radius: 4px; flex-wrap: wrap; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        .bulk-actions-left { display: flex; align-items: center; gap: 12px; }
        .bulk-actions-left input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
        .bulk-actions-left label { font-size: 13px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .bulk-actions-right { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-bulk { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 14px; font-size: 12px; font-weight: 600; text-transform: uppercase; border-radius: 2px; cursor: pointer; transition: all 0.2s; }
        .btn-bulk:hover { background: var(--text-main); color: var(--bg-color); border-color: var(--text-main); }
        .btn-bulk-delete { color: #ff4d4d; border-color: #ff4d4d; }
        .btn-bulk-delete:hover { background: #ff4d4d; color: #ffffff; border-color: #ff4d4d; }

        /* =========================================
           Index View (카드 그리드)
           ========================================= */
        #indexView { display: block; flex: 1; }
        
        .archive-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 20px; }
        .card { display: flex; flex-direction: column; position: relative; cursor: pointer; transition: transform 0.2s; }
        .card:hover .card-image { opacity: 0.85; }
        .card-image { width: 100%; aspect-ratio: 16 / 10; border: 1px solid var(--border-color); border-radius: 2px; background-color: var(--border-color); margin-bottom: 16px; background-size: cover; background-position: center; transition: opacity 0.2s; position: relative; }
        
        .card-checkbox { display: none; position: absolute; top: 12px; left: 12px; z-index: 20; transform: scale(1.3); pointer-events: none; }
        .select-mode .card-checkbox { display: block; }
        .select-mode .card:hover .card-actions { opacity: 0; } 
        .select-mode .pin-icon { pointer-events: none; }

        .pin-icon { position: absolute; top: 10px; left: 10px; font-size: 18px; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.5); z-index: 10; transition: transform 0.2s; color: #ffffff;}
        .pin-icon:hover { transform: scale(1.2); }
        .select-mode .pin-icon { left: 36px; } 
        
        .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; opacity: 0; transition: opacity 0.2s; }
        .card:hover .card-actions { opacity: 1; }
        .action-btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 2px; text-transform: uppercase;}
        .action-btn:hover { color: var(--bg-color); background: var(--text-main); border-color: var(--text-main);}

        .card-tags { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;}
        .card-title { font-size: 16px; font-weight: 500; color: var(--text-main); line-height: 1.3; }

        /* =========================================
           Detail View
           ========================================= */
        #detailView { display: none; flex: 1; max-width: 1000px; width: 100%; margin: 0 auto; padding-bottom: 60px; }
        .detail-top-bar { display: flex; justify-content: space-between; margin-bottom: 60px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; text-transform: uppercase; font-size: 13px;}
        .back-link { cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .back-link:hover { color: var(--text-main); }
        .detail-actions { display: flex; gap: 16px; color: var(--text-muted);}
        .detail-actions span { cursor: pointer; }
        .detail-actions span:hover { color: var(--text-main); }

        .blog-title { font-size: 50px; font-weight: 500; line-height: 1.1; margin-bottom: 40px; letter-spacing: -2px; }
        .detail-info { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 60px; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 20px;}
        .detail-info-col span { display: block; color: var(--text-main); font-size: 15px; margin-top: 4px; }
        .blog-content { font-size: 16px; line-height: 1.8; color: var(--text-main); }
        .blog-content img { max-width: 100%; margin: 40px 0; display: block; }
        .blog-content a { color: var(--text-main); text-decoration: underline; break-words: break-all; }

        /* --- Modal --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-bg); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px);}
        .modal-content { background: var(--modal-bg); padding: 40px; width: 100%; max-width: 900px; max-height: 95vh; overflow-y: auto; color: var(--modal-text); border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.2);}
        .modal-content.small { max-width: 600px; }
        .modal-content h3 { margin-bottom: 24px; font-weight: 500; text-transform: uppercase; font-size: 18px;}
        
        .form-row { display: flex; gap: 20px; margin-bottom: 20px; position: relative; flex-wrap: wrap;}
        .form-group { flex: 1; min-width: 150px; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase;}
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border-color); background: var(--modal-bg); color: var(--modal-text); font-family: 'Inter', sans-serif; outline: none; border-radius: 0; }
        .form-group input:focus, .form-group select:focus { border-color: var(--modal-text); }
        
        .editor-wrapper { position: relative; margin-bottom: 20px; }
        .editor-wrapper label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase;}
        #editor-container { height: 400px; background: var(--modal-bg); border-color: var(--border-color); font-family: 'Inter', sans-serif; font-size: 15px; color: var(--modal-text); }
        
        .ql-toolbar { background: var(--modal-bg); border-color: var(--border-color) !important; }
        .ql-container { border-color: var(--border-color) !important; }
        .ql-snow .ql-stroke { stroke: var(--modal-text); }
        .ql-snow .ql-fill { fill: var(--modal-text); }
        .ql-snow .ql-picker { color: var(--modal-text); }
        
        .thumbnail-picker { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; border: 1px dashed var(--border-color); padding: 12px; align-items: center; }
        .thumbnail-option { width: 80px; height: 80px; object-fit: cover; border: 2px solid transparent; cursor: pointer; opacity: 0.4; flex-shrink: 0; }
        .thumbnail-option.selected { border-color: var(--modal-text); opacity: 1; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-modal-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--modal-text); padding: 10px 20px; cursor: pointer; font-family: 'Inter'; text-transform: uppercase; font-size: 13px;}
        .btn-modal-save { background: var(--modal-text); border: 1px solid var(--modal-text); color: var(--bg-color); padding: 10px 20px; cursor: pointer; font-weight: 600; font-family: 'Inter'; text-transform: uppercase; font-size: 13px;}

        /* 설정 모달 */
        .manage-section { margin-bottom: 30px; }
        .manage-section h4 { font-size: 13px; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase;}
        .manage-list { display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; margin-bottom: 12px; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border-color);}
        .manage-item button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; text-transform: uppercase;}
        .manage-item button:hover { color: var(--modal-text); }
        .add-input-group { display: flex; gap: 8px; }
        .add-input-group input { flex: 1; padding: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--modal-text); }
        .add-input-group button { padding: 8px 16px; background: var(--modal-text); color: var(--bg-color); border: none; cursor: pointer; text-transform: uppercase; font-size: 12px;}

        .btn-recommend { background: transparent; border: 1px solid var(--border-color); color: var(--modal-text); padding: 0 16px; height: 40px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; transition: all 0.2s; align-self: flex-end; margin-bottom: 20px; }
        .btn-recommend:hover { background: var(--modal-text); color: var(--bg-color); border-color: var(--modal-text); }

        .image-resize-ui { position: absolute; background: var(--modal-bg); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); display: none; gap: 8px; align-items: center; z-index: 2000; }
        .image-resize-ui input { width: 60px; padding: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); outline: none;}
        .drag-handle { cursor: ew-resize; background: var(--border-color); padding: 4px 8px; font-size: 12px; color: var(--text-main); user-select: none; }
        .ql-editor img { cursor: pointer; transition: outline 0.1s; }
        .ql-editor img.active-resize { outline: 2px solid var(--modal-text); }

        /* =========================================
           🔥 반응형 (Mobile & Tablet)
           ========================================= */
        @media (max-width: 1024px) {
            body { padding: 30px 40px; }
            .archive-grid { grid-template-columns: repeat(3, 1fr); gap: 30px 15px; }
            .directory-filters { gap: 60px; }
        }

        @media (max-width: 768px) {
            .archive-grid { grid-template-columns: repeat(2, 1fr); }
            .header-top { flex-direction: column; align-items: flex-start; gap: 20px; }
            .header-actions { width: 100%; justify-content: flex-start; gap: 15px; }
            .search-box { flex: 1; }
            .search-box input { width: 100%; }
        }

        @media (max-width: 600px) {
            body { padding: 20px 16px; }
            .logo-area h1 { font-size: 28px; }
            .directory-filters { flex-wrap: wrap; gap: 30px; }
            .filter-group { flex: 1 1 40%; }
            .archive-grid { grid-template-columns: repeat(2, 1fr); gap: 24px 12px; }
            .card-title { font-size: 14px; }
            .card-tags { font-size: 10px; }
            .card .card-actions { opacity: 1; } 
            
            .bulk-actions-right { width: 100%; justify-content: space-between; }
            .btn-bulk, .btn-bulk-delete { flex: 1; text-align: center; }
            
            .modal-content { padding: 24px 16px; width: 95%; }
            .form-row { flex-direction: column; gap: 12px; }
            .form-group { min-width: 100%; margin-bottom: 12px; }
            .btn-recommend { width: 100%; margin-top: 4px; }
            #editor-container { height: 280px; }
            .detail-info { grid-template-columns: 1fr; gap: 16px; }
            .blog-title { font-size: 32px; margin-bottom: 24px; letter-spacing: -1px;}
        }
    </style>
</head>
<body class="view-index">

    <div class="header-top">
        <div class="logo-area">
            <h1 onclick="resetFilters()">Archive.</h1>
        </div>

        <div class="header-actions">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search" oninput="handleSearch()">
            </div>
            <span onclick="toggleTheme()" id="themeBtn" title="Toggle Theme" style="font-size: 16px; margin-right: 5px;">🌙</span>
            <span onclick="openManageModal()">Settings</span>
            <span onclick="openModal()">+ Add</span>
        </div>
    </div>

    <!-- 공통 필터 영역 -->
    <div class="filter-section" id="filterSection">
        <div class="directory-filters">
            <div class="filter-group">
                <div class="filter-title">Category</div>
                <div class="filter-list-container" id="categoryFilterList"></div>
            </div>
            <div class="filter-group">
                <div class="filter-title">Platforms</div>
                <div class="filter-list-container" id="platformFilterList"></div>
            </div>
            <div class="filter-group">
                <div class="filter-title">Moods</div>
                <div class="filter-list-container" id="moodFilterList"></div>
            </div>
        </div>
        <!-- 선택된 필터 표시 -->
        <div class="active-filters-area" id="activeFiltersArea"></div>
    </div>

    <!-- Index View -->
    <div id="indexView">
        <!-- 🔥 게시글 상단 컨트롤 (Select 모드 버튼) -->
        <div class="grid-controls">
            <span id="selectModeBtn" onclick="toggleSelectMode()">Select</span>
        </div>

        <!-- 다중 선택/일괄 작업 바 (선택 모드일 때만 표시) -->
        <div class="bulk-actions" id="bulkActions" style="display: none;">
            <div class="bulk-actions-left">
                <input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this.checked)">
                <label for="selectAllCheckbox">Select All (<span id="selectedCount">0</span>)</label>
            </div>
            <div class="bulk-actions-right">
                <button class="btn-bulk" onclick="openBulkMoveModal()">Move Selected</button>
                <button class="btn-bulk btn-bulk-delete" onclick="deleteSelected()">Delete</button>
                <button class="btn-bulk" onclick="toggleSelectMode()">Cancel</button>
            </div>
        </div>

        <!-- 카드 그리드 -->
        <div class="archive-grid" id="indexGrid"></div>
    </div>

    <!-- 디테일 뷰 -->
    <div id="detailView">
        <div class="detail-top-bar">
            <span class="back-link" onclick="restoreView()">← Back</span>
            <div class="detail-actions">
                <span id="detailPinBtn">Pin</span>
                <span id="detailEditBtn">Edit</span>
                <span id="detailDeleteBtn">Delete</span>
            </div>
        </div>
        <h1 class="blog-title" id="detailTitle">Title</h1>
        <div class="detail-info">
            <div class="detail-info-col">CATEGORY<span id="detailCat"></span></div>
            <div class="detail-info-col">PLATFORMS<span id="detailPlat"></span></div>
            <div class="detail-info-col">MOODS<span id="detailMood"></span></div>
        </div>
        <div class="blog-content" id="detailContent"></div>
    </div>

    <!-- 글쓰기/단일 수정 모달 -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Item</h3>
            <form id="postForm">
                <input type="hidden" id="postId">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="postTitle" required placeholder="Title">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category (Multi)</label>
                        <select id="postCategory" multiple style="height: 120px;"></select>
                    </div>
                    <div class="form-group">
                        <label>Platform (Multi)</label>
                        <select id="postTags" multiple style="height: 120px;"></select>
                    </div>
                    <div class="form-group">
                        <label>Mood (Multi)</label>
                        <select id="postMoods" multiple style="height: 120px;"></select>
                    </div>
                    <button type="button" class="btn-recommend" onclick="autoRecommendTags()">자동 추천</button>
                </div>
                <div class="editor-wrapper">
                    <label>Content (Paste Image or URL)</label>
                    <div id="editor-container"></div>
                    <div class="image-resize-ui" id="resizeUI">
                        <input type="number" id="imgWidth"> <span style="color:#aaa;">×</span> <input type="number" id="imgHeight">
                        <button type="button" class="action-btn" id="imgApplyBtn">Set</button>
                        <div class="drag-handle" id="dragHandle">↔ Drag</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Thumbnail Cover</label>
                    <div id="thumbnailPicker" class="thumbnail-picker"></div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-modal-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 다중 이동(Move) 모달 -->
    <div class="modal-overlay" id="bulkMoveModal">
        <div class="modal-content small">
            <h3>Move Selected Items</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">선택한 게시글들을 아래 지정한 위치로 일괄 이동(변경)합니다.</p>
            <form id="bulkMoveForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="bulkMoveCategory" multiple style="height: 120px;"></select>
                    </div>
                    <div class="form-group">
                        <label>Platform</label>
                        <select id="bulkMovePlatform" multiple style="height: 120px;"></select>
                    </div>
                    <div class="form-group">
                        <label>Mood</label>
                        <select id="bulkMoveMood" multiple style="height: 120px;"></select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" onclick="closeBulkMoveModal()">Cancel</button>
                    <button type="submit" class="btn-modal-save">Move</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div class="modal-overlay" id="manageModal">
        <div class="modal-content small">
            <h3>Settings</h3>
            <div class="manage-section">
                <h4>Categories</h4>
                <div class="manage-list" id="manageCategoryList"></div>
                <div class="add-input-group"><input type="text" id="newCategoryInput"><button type="button" onclick="addCategory()">Add</button></div>
            </div>
            <div class="manage-section">

        function autoRecommendTags() { const txt = (document.getElementById('postTitle').value + " " + quill.getText()).toLowerCase(); const dict = { "photoshop": ["포토샵", "psd"], "illustrator": ["일러스트레이터", "일러", "ai"], "3d": ["blender", "블렌더", "c4d", "maya", "3d"], "web design & development": ["웹디자인", "웹", "html"], "fashion": ["패션", "옷"], "typography": ["타이포그래피", "폰트"], "music": ["음악", "뮤직"], "photography": ["사진", "카메라"], "귀여운": ["귀여운", "아기자기한", "큐트", "cute", "캐릭터"], "심플한": ["심플한", "단순한", "미니멀", "깔끔한"], "시크": ["시크한", "무채색", "블랙", "차분한", "모던"] }; let count = 0; const check = (term) => { const lt = term.toLowerCase(); return txt.includes(lt) || (dict[lt] && dict[lt].some(s => txt.includes(s))); }; Array.from(document.getElementById('postCategory').options).forEach(o => { if(!o.selected && check(o.value)) { o.selected = true; count++; } }); Array.from(document.getElementById('postTags').options).forEach(o => { if(!o.selected && check(o.value)) { o.selected = true; count++; } }); Array.from(document.getElementById('postMoods').options).forEach(o => { if(!o.selected && check(o.value)) { o.selected = true; count++; } }); if(count>0) alert(`${count}개 항목이 자동 추천되었습니다.`); else alert(`추천할 수 있는 일치 항목이 없습니다.`); }

            const visibleCards = document.querySelectorAll('.card-checkbox').length;

            if(event) event.stopPropagation();
            const post = posts.find(p => p.id === id); if(!post) return;
            const newPinned = !post.pinned;
            const { error } = await supabaseClient.from('posts').update({ pinned: newPinned }).eq('id', id);

        function renderFiltersUI() {
            const renderList = (id, master, activeList) => {
                const div = document.getElementById(id); div.innerHTML = '';
                master.forEach(item => {
                    const el = document.createElement('div'); el.className = 'filter-item'; 
                    if(activeList.includes(item)) el.classList.add('active'); 
                    el.innerText = item;
                    el.onclick = () => { 
                        if (activeList.includes(item)) activeList.splice(activeList.indexOf(item), 1);
                        else activeList.push(item); 
                        renderFiltersUI(); renderCards(); 
                    };
                    div.appendChild(el);
                });
            }
            renderList('categoryFilterList', masterCategories, activeCategories);
            renderList('platformFilterList', masterPlatforms, activePlatforms);
            renderList('moodFilterList', masterMoods, activeMoods);

            const activeArea = document.getElementById('activeFiltersArea'); activeArea.innerHTML = '';
            const createActiveTag = (type, val) => {
                const tag = document.createElement('div'); tag.className = 'active-filter-tag';
                tag.innerHTML = `${val} <span class="remove-btn">✕</span>`;
                tag.onclick = () => {
                    if(type === 'cat') activeCategories.splice(activeCategories.indexOf(val), 1);
                    if(type === 'plat') activePlatforms.splice(activePlatforms.indexOf(val), 1);
                    if(type === 'mood') activeMoods.splice(activeMoods.indexOf(val), 1);

                activeArea.appendChild(tag);
            };
            activeCategories.forEach(c => createActiveTag('cat', c));
            activePlatforms.forEach(p => createActiveTag('plat', p));
            activeMoods.forEach(m => createActiveTag('mood', m));

            if(activeCategories.length > 0 || activePlatforms.length > 0 || activeMoods.length > 0) {
                const clearBtn = document.createElement('div'); clearBtn.className = 'active-filter-tag clear-all'; clearBtn.innerText = 'Clear All';
                clearBtn.onclick = resetFilters; activeArea.appendChild(clearBtn);

        function resetFilters() { activeCategories = []; activePlatforms = []; activeMoods = []; document.getElementById('searchInput').value=''; searchQuery=""; renderFiltersUI(); renderCards(); }
        
        function renderCards() {
            const indexGrid = document.getElementById('indexGrid'); indexGrid.innerHTML = '';
            
            let filtered = posts.filter(post => {
                const cats = post.category || [], tags = post.tags || [], moods = post.moods || [];
                const matchC = activeCategories.length === 0 || activeCategories.some(c => cats.includes(c));
                const matchP = activePlatforms.length === 0 || activePlatforms.some(p => tags.includes(p));
                const matchM = activeMoods.length === 0 || activeMoods.some(m => moods.includes(m));
                let matchSearch = true;
                if(searchQuery) { const textDump = (post.title + " " + post.content + " " + cats.join(" ") + " " + tags.join(" ") + " " + moods.join(" ")).toLowerCase(); matchSearch = textDump.includes(searchQuery); }
                return matchC && matchP && matchM && matchSearch;
            });
            
            filtered.sort((a, b) => {
                const aPin = a.pinned ? 1 : 0; const bPin = b.pinned ? 1 : 0;
                if (aPin !== bPin) return bPin - aPin;
                return b.id - a.id; 
            });

            if(filtered.length === 0) { indexGrid.innerHTML = `<div style="color:var(--text-muted); padding: 20px 0;">No items found.</div>`; updateBulkUI(); return; }

            filtered.forEach(post => {
                const cats = (post.category||[]).join(', ');
                const tagsAndMoods = [...(post.tags||[]), ...(post.moods||[])].join(', ');
                const bg = post.thumbnail ? post.thumbnail : '';
                const pinMark = post.pinned ? '★' : '☆';
                
                const isChecked = selectedPostIds.has(post.id) ? 'checked' : '';

                const card = document.createElement('div');
                card.className = 'card';

                    if (isSelectMode) {
                        const cb = card.querySelector('.card-checkbox');
                        cb.checked = !cb.checked;
                        toggleSelect(post.id, cb.checked);
                    } else {
                        showDetail(post.id);
                    }
                };
                
                card.innerHTML = `
                    <div class="card-image" style="background-image: url('${bg}')">
                        <input type="checkbox" class="card-checkbox" value="${post.id}" ${isChecked}>
                        <div class="pin-icon" onclick="togglePin(${post.id}, event)" title="Pin">${pinMark}</div>
                        <div class="card-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); openModal(${post.id})">Edit</button>
                            <button class="action-btn" onclick="event.stopPropagation(); deletePost(${post.id})">Del</button>
                        </div>
                    </div>
                    <div class="card-tags">${cats ? cats + ' / ' : ''}${tagsAndMoods}</div>

        async function editCategory(idx) { const oldName = masterCategories[idx]; const newName = prompt('Edit Category Name:', oldName); if(newName && newName.trim() && newName !== oldName) { const trimmed = newName.trim(); masterCategories[idx] = trimmed; if(activeCategories.includes(oldName)) activeCategories[activeCategories.indexOf(oldName)] = trimmed; const updates = []; posts.forEach(p => { const i = (p.category||[]).indexOf(oldName); if(i > -1) { p.category[i] = trimmed; updates.push({ id: p.id, category: p.category }); } }); if(updates.length > 0) await Promise.all(updates.map(u => supabaseClient.from('posts').update({ category: u.category }).eq('id', u.id))); saveSettingsData(); } }
        async function editPlatform(idx) { const oldName = masterPlatforms[idx]; const newName = prompt('Edit Platform Name:', oldName); if(newName && newName.trim() && newName !== oldName) { const trimmed = newName.trim(); masterPlatforms[idx] = trimmed; if(activePlatforms.includes(oldName)) activePlatforms[activePlatforms.indexOf(oldName)] = trimmed; const updates = []; posts.forEach(p => { const i = (p.tags||[]).indexOf(oldName); if(i > -1) { p.tags[i] = trimmed; updates.push({ id: p.id, tags: p.tags }); } }); if(updates.length > 0) await Promise.all(updates.map(u => supabaseClient.from('posts').update({ tags: u.tags }).eq('id', u.id))); saveSettingsData(); } }
        async function editMood(idx) { const oldName = masterMoods[idx]; const newName = prompt('Edit Mood Name:', oldName); if(newName && newName.trim() && newName !== oldName) { const trimmed = newName.trim(); masterMoods[idx] = trimmed; if(activeMoods.includes(oldName)) activeMoods[activeMoods.indexOf(oldName)] = trimmed; const updates = []; posts.forEach(p => { const i = (p.moods||[]).indexOf(oldName); if(i > -1) { p.moods[i] = trimmed; updates.push({ id: p.id, moods: p.moods }); } }); if(updates.length > 0) await Promise.all(updates.map(u => supabaseClient.from('posts').update({ moods: u.moods }).eq('id', u.id))); saveSettingsData(); } }

        function addCategory() { const v = document.getElementById('newCategoryInput').value.trim(); if(v && !masterCategories.includes(v)) { masterCategories.push(v); document.getElementById('newCategoryInput').value = ''; saveSettingsData(); renderManageLists(); } }
        function deleteCategory(idx) { if(confirm('Delete?')) { masterCategories.splice(idx, 1); saveSettingsData(); renderManageLists(); } }
        
        function addPlatform() { const v = document.getElementById('newPlatformInput').value.trim(); if(v && !masterPlatforms.includes(v)) { masterPlatforms.push(v); document.getElementById('newPlatformInput').value = ''; saveSettingsData(); renderManageLists(); } }
        function deletePlatform(idx) { if(confirm('Delete?')) { masterPlatforms.splice(idx, 1); saveSettingsData(); renderManageLists(); } }
        
        function addMood() { const v = document.getElementById('newMoodInput').value.trim(); if(v && !masterMoods.includes(v)) { masterMoods.push(v); document.getElementById('newMoodInput').value = ''; saveSettingsData(); renderManageLists(); } }
        function deleteMood(idx) { if(confirm('Delete?')) { masterMoods.splice(idx, 1); saveSettingsData(); renderManageLists(); } }

        // ==========================================
        // 단일 글쓰기 / 수정 모달
        // ==========================================
        const modal = document.getElementById('postModal'); const form = document.getElementById('postForm');
        function openModal(id = null) {
            modal.style.display = 'flex';
            const catSel = document.getElementById('postCategory'); const platSel = document.getElementById('postTags'); const moodSel = document.getElementById('postMoods');
            catSel.innerHTML = ''; platSel.innerHTML = ''; moodSel.innerHTML = '';
            masterCategories.forEach(c => { const o = document.createElement('option'); o.value = c; o.innerText = c; catSel.appendChild(o); });
            masterPlatforms.forEach(p => { const o = document.createElement('option'); o.value = p; o.innerText = p; platSel.appendChild(o); });
            masterMoods.forEach(m => { const o = document.createElement('option'); o.value = m; o.innerText = m; moodSel.appendChild(o); });
            
            if (id) {
                document.getElementById('modalTitle').innerText = 'Edit Item'; const post = posts.find(p => p.id === id);
                document.getElementById('postId').value = post.id; document.getElementById('postTitle').value = post.title; selectedThumbnail = post.thumbnail || "";
                const cats = post.category || []; Array.from(catSel.options).forEach(o => o.selected = cats.includes(o.value));
                const tags = post.tags || []; Array.from(platSel.options).forEach(o => o.selected = tags.includes(o.value));
                const moods = post.moods || []; Array.from(moodSel.options).forEach(o => o.selected = moods.includes(o.value));
                quill.root.innerHTML = post.content || ""; updateThumbnailPicker();
            } else {
                document.getElementById('modalTitle').innerText = 'Add Item'; form.reset(); document.getElementById('postId').value = ''; selectedThumbnail = "";
                Array.from(catSel.options).forEach(o => o.selected = false); Array.from(platSel.options).forEach(o => o.selected = false); Array.from(moodSel.options).forEach(o => o.selected = false);
                quill.root.innerHTML = ""; updateThumbnailPicker();
            }
        }
        function closeModal() { modal.style.display = 'none'; }
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const id = document.getElementById('postId').value;
            const selCats = Array.from(document.getElementById('postCategory').selectedOptions).map(o => o.value);
            const selPlats = Array.from(document.getElementById('postTags').selectedOptions).map(o => o.value);
            const selMoods = Array.from(document.getElementById('postMoods').selectedOptions).map(o => o.value);
            
            let isPinned = false; if(id) { const exist = posts.find(p => p.id == id); if(exist) isPinned = exist.pinned; }
            const postData = { title: document.getElementById('postTitle').value, category: selCats, tags: selPlats, moods: selMoods, thumbnail: selectedThumbnail, content: quill.root.innerHTML, pinned: isPinned };

            if (id) {
                const { error } = await supabaseClient.from('posts').update(postData).eq('id', id);
                if (error) { alert('수정 실패: ' + error.message); return; }
            } else {
                const { error } = await supabaseClient.from('posts').insert([{ id: Date.now(), ...postData }]);
                if (error) { alert('작성 실패: ' + error.message); return; }
            }

            closeModal(); await fetchPosts();
            if(document.getElementById('detailView').style.display === 'block' && currentDetailId == id) showDetail(Number(id));
        });

        async function deletePost(id) {
            if(!confirm("Delete this item?")) return;
            const { error } = await supabaseClient.from('posts').delete().eq('id', id);
            if (error) { alert('삭제 실패: ' + error.message); return; }
            
            selectedPostIds.delete(id); 
            await fetchPosts();
            if(document.getElementById('detailView').style.display === 'block' && currentDetailId == id) restoreView();
        }

        renderFiltersUI();
        fetchPosts();
    </script>
</body>
