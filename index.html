<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Archive - Index (Active Filters)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        /* --- 테마 변수 (라이트 모드 기본) --- */
        :root {
            --bg-color: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --border-color: #eeeeee;
            --border-strong: #000000;
            --overlay-bg: rgba(0,0,0,0.5);
            --modal-bg: #ffffff;
            --modal-text: #000000;
            --hover-bg: #f9f9f9;
        }

        /* --- 테마 변수 (다크 모드) --- */
        body.dark-mode {
            --bg-color: #000000;
            --text-main: #ffffff;
            --text-muted: #666666;
            --border-color: #222222;
            --border-strong: #ffffff;
            --overlay-bg: rgba(255,255,255,0.1);
            --modal-bg: #111111;
            --modal-text: #ffffff;
            --hover-bg: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 60px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- Header --- */
        .header-top { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 60px; position: relative; z-index: 10;
            flex-wrap: wrap; gap: 20px;
        }
        .logo-area h1 { font-size: 32px; font-weight: 600; letter-spacing: -1px; cursor: pointer; text-transform: uppercase; margin: 0; line-height: 1;}
        
        .header-actions { display: flex; gap: 20px; align-items: center; font-size: 14px; text-transform: uppercase; font-weight: 500; flex-wrap: wrap;}
        .header-actions span { cursor: pointer; transition: opacity 0.2s; }
        .header-actions span:hover { opacity: 0.6; }
        
        .search-box input { 
            background: transparent; border: none; border-bottom: 1px solid var(--text-muted); 
            color: var(--text-main); padding: 5px 0; font-size: 13px; outline: none; width: 150px;
            font-family: 'Inter', sans-serif; text-transform: uppercase; transition: width 0.3s;
        }
        .search-box input:focus { width: 200px; border-color: var(--text-main); }

        /* =========================================
           필터 영역
           ========================================= */
        .filter-section {
            margin-bottom: 40px;
        }
        .directory-filters { display: flex; gap: 40px; margin-bottom: 20px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; gap: 8px; min-width: 120px; }
        .filter-title { font-weight: 600; color: var(--text-main); margin-bottom: 8px; text-transform: uppercase;}
        .filter-item { cursor: pointer; transition: color 0.2s; }
        .filter-item:hover, .filter-item.active { color: var(--text-main); }

        /* 내가 선택한 필터(Active Filters) 영역 */
        .active-filters-area {
            display: flex; gap: 10px; flex-wrap: wrap; 
            min-height: 30px;
        }
        .active-filter-tag {
            background-color: var(--text-main);
            color: var(--bg-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .active-filter-tag:hover {
            opacity: 0.8; transform: scale(0.98);
        }
        .active-filter-tag .remove-btn { font-size: 10px; font-weight: bold; }
        
        .active-filter-tag.clear-all {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }
        .active-filter-tag.clear-all:hover {
            color: var(--text-main); border-color: var(--text-main); background-color: transparent;
        }

        /* =========================================
           Index View (카드 뷰)
           ========================================= */
        #indexView { display: block; flex: 1; }
        
        .archive-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 20px; }
        .card { display: flex; flex-direction: column; position: relative; cursor: pointer; transition: transform 0.2s; }
        .card:hover .card-image { opacity: 0.85; }
        .card-image {
            width: 100%; aspect-ratio: 16 / 10; border: 1px solid var(--border-color); border-radius: 2px;
            background-color: var(--border-color); margin-bottom: 16px; background-size: cover; background-position: center; transition: opacity 0.2s;
            position: relative;
        }
        
        .card-tags { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;}
        .card-title { font-size: 16px; font-weight: 500; color: var(--text-main); line-height: 1.3; }
        
        .card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; opacity: 0; transition: opacity 0.2s; }
        .card:hover .card-actions { opacity: 1; }
        
        .pin-icon { 
            position: absolute; top: 10px; left: 10px; 
            font-size: 18px; cursor: pointer; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); 
            z-index: 10; transition: transform 0.2s; 
            color: #ffffff;
        }
        .pin-icon:hover { transform: scale(1.2); }
        
        .action-btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 2px; text-transform: uppercase;}
        .action-btn:hover { color: var(--bg-color); background: var(--text-main); border-color: var(--text-main);}

        /* --- Detail View --- */
        #detailView { display: none; flex: 1; max-width: 1000px; width: 100%; margin: 0 auto; padding-bottom: 60px; }
        .detail-top-bar { display: flex; justify-content: space-between; margin-bottom: 60px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; text-transform: uppercase; font-size: 13px;}
        .back-link { cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .back-link:hover { color: var(--text-main); }
        .detail-actions { display: flex; gap: 16px; color: var(--text-muted);}
        .detail-actions span { cursor: pointer; }
        .detail-actions span:hover { color: var(--text-main); }

        .blog-title { font-size: 50px; font-weight: 500; line-height: 1.1; margin-bottom: 40px; letter-spacing: -2px; }
        .detail-info { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 60px; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 20px;}
        .detail-info-col span { display: block; color: var(--text-main); font-size: 15px; margin-top: 4px; }
        .blog-content { font-size: 16px; line-height: 1.8; color: var(--text-main); }
        .blog-content img { max-width: 100%; margin: 40px 0; display: block; }
        .blog-content a { color: var(--text-main); text-decoration: underline; }

        /* --- Modal --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-bg); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px);}
        .modal-content { background: var(--modal-bg); padding: 40px; width: 100%; max-width: 900px; max-height: 95vh; overflow-y: auto; color: var(--modal-text); border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.2);}
        .modal-content.small { max-width: 600px; }
        .modal-content h3 { margin-bottom: 24px; font-weight: 500; text-transform: uppercase; font-size: 18px;}
        
        .form-row { display: flex; gap: 16px; margin-bottom: 20px; position: relative; align-items: flex-end; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 180px; margin-bottom: 20px; }
        .form-row .form-group { margin-bottom: 0; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase;}
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid var(--border-color); background: var(--modal-bg); color: var(--modal-text);
            font-family: 'Inter', sans-serif; outline: none; border-radius: 0;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--modal-text); }
        
        /* 자동추천 버튼 스타일 */
        .btn-recommend {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--modal-text);
            padding: 0 16px;
            height: 40px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-recommend:hover {
            background: var(--modal-text);
            color: var(--bg-color);
            border-color: var(--modal-text);
        }

        .editor-wrapper { position: relative; margin-bottom: 20px; }
        .editor-wrapper label { display: block; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase;}
        #editor-container { height: 400px; background: var(--modal-bg); border-color: var(--border-color); font-family: 'Inter', sans-serif; font-size: 15px; color: var(--modal-text); }
        
        .ql-toolbar { background: var(--modal-bg); border-color: var(--border-color) !important; }
        .ql-container { border-color: var(--border-color) !important; }
        .ql-snow .ql-stroke { stroke: var(--modal-text); }
        .ql-snow .ql-fill { fill: var(--modal-text); }
        .ql-snow .ql-picker { color: var(--modal-text); }
        
        .thumbnail-picker { display: flex; gap: 12px; overflow-x: auto; padding: 10px 0; border: 1px dashed var(--border-color); padding: 12px; align-items: center; }
        .thumbnail-option { width: 80px; height: 80px; object-fit: cover; border: 2px solid transparent; cursor: pointer; opacity: 0.4; }
        .thumbnail-option.selected { border-color: var(--modal-text); opacity: 1; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-modal-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--modal-text); padding: 10px 20px; cursor: pointer; font-family: 'Inter'; text-transform: uppercase; font-size: 13px;}
        .btn-modal-save { background: var(--modal-text); border: 1px solid var(--modal-text); color: var(--bg-color); padding: 10px 20px; cursor: pointer; font-weight: 600; font-family: 'Inter'; text-transform: uppercase; font-size: 13px;}

        /* 설정 모달 */
        .manage-section { margin-bottom: 30px; }
        .manage-section h4 { font-size: 13px; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase;}
        .manage-list { display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; margin-bottom: 12px; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border-color);}
        .manage-item button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; text-transform: uppercase;}
        .manage-item button:hover { color: var(--modal-text); }
        .add-input-group { display: flex; gap: 8px; }
        .add-input-group input { flex: 1; padding: 8px; border: 1px solid var(--border-color); background: transparent; color: var(--modal-text); }
        .add-input-group button { padding: 8px 16px; background: var(--modal-text); color: var(--bg-color); border: none; cursor: pointer; text-transform: uppercase; font-size: 12px;}

        /* 리사이즈 툴 */
        .image-resize-ui {
            position: absolute; background: var(--modal-bg); border: 1px solid var(--border-color); padding: 8px 12px;
            border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); display: none; gap: 8px; align-items: center; z-index: 2000;
        }
        .image-resize-ui input { width: 60px; padding: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-main); outline: none;}
        .drag-handle { cursor: ew-resize; background: var(--border-color); padding: 4px 8px; font-size: 12px; color: var(--text-main); user-select: none; }
        .ql-editor img { cursor: pointer; transition: outline 0.1s; }
        .ql-editor img.active-resize { outline: 2px solid var(--modal-text); }

        /* =========================================
           [반응형 (Mobile & Tablet) 스타일]
           ========================================= */
        @media (max-width: 1024px) {
            body { padding: 30px 40px; }
            .archive-grid { grid-template-columns: repeat(2, 1fr); gap: 30px 20px; }
            .blog-title { font-size: 40px; }
        }

        @media (max-width: 600px) {
            body { padding: 20px 16px; }
            
            .header-top { margin-bottom: 30px; }
            .logo-area h1 { font-size: 26px; }
            
            /* 검색창 모바일 너비 확장 */
            .search-box input { width: 120px; }
            .search-box input:focus { width: 150px; }
            
            /* 카드 1열 배치 및 모바일에서 액션 버튼 항상 표시 */
            .archive-grid { grid-template-columns: 1fr; gap: 24px; }
            .card .card-actions { opacity: 1; }
            
            /* 필터 세로 간격 및 레이아웃 조정 */
            .directory-filters { gap: 24px; }
            .filter-group { flex: 1; min-width: 100px; }
            
            /* 모달 창 안쪽 여백 및 입력란 1열 배치 */
            .modal-content { padding: 24px 16px; }
            .form-row { flex-direction: column; align-items: stretch; gap: 12px; }
            .form-group { min-width: 100%; margin-bottom: 12px; }
            .btn-recommend { width: 100%; margin-top: 4px; }
            #editor-container { height: 280px; }
            
            /* 디테일 페이지 반응형 */
            .blog-title { font-size: 32px; margin-bottom: 24px; letter-spacing: -1px; }
            .detail-info { grid-template-columns: 1fr; gap: 16px; margin-bottom: 36px; }
        }
    </style>
</head>
<body class="view-index">

    <div class="header-top">
        <div class="logo-area">
            <h1 onclick="resetFilters()">Archive.</h1>
        </div>

        <div class="header-actions">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search" oninput="handleSearch()">
            </div>
            <!-- 테마 전환 버튼 (텍스트 변경) -->
            <span onclick="toggleTheme()" id="themeBtn" title="Toggle Theme" style="margin-right: 10px;">DARK</span>
            
            <span onclick="openManageModal()">Settings</span>
            <span onclick="openModal()">+ Add</span>
        </div>
    </div>

    <!-- 공통 필터 영역 -->
    <div class="filter-section" id="filterSection">
        <div class="directory-filters">
            <div class="filter-group">
                <div class="filter-title">Category</div>
                <div id="categoryFilterList"></div>
            </div>
            <div class="filter-group">
                <div class="filter-title">Platforms</div>
                <div id="platformFilterList"></div>
            </div>
            <div class="filter-group">
                <div class="filter-title">Moods</div>
                <div id="moodFilterList"></div>
            </div>
        </div>

        <!-- 선택된 필터 표시 (Active Filters) 영역 -->
        <div class="active-filters-area" id="activeFiltersArea">
            <!-- 자바스크립트로 선택한 태그들이 렌더링됨 -->
        </div>
    </div>

    <!-- =====================================
         Index View (기본 - 카드 그리드)
         ===================================== -->
    <div id="indexView">
        <div class="archive-grid" id="indexGrid"></div>
    </div>

    <!-- 디테일 뷰 -->
    <div id="detailView">
        <div class="detail-top-bar">
            <span class="back-link" onclick="restoreView()">← Back</span>
            <div class="detail-actions">
                <span id="detailPinBtn">Pin</span>
                <span id="detailEditBtn">Edit</span>
                <span id="detailDeleteBtn">Delete</span>
            </div>
        </div>
        
        <h1 class="blog-title" id="detailTitle">Title</h1>
        
        <div class="detail-info">
            <div class="detail-info-col">
                CATEGORY
                <span id="detailCat"></span>
            </div>
            <div class="detail-info-col">
                PLATFORMS
                <span id="detailPlat"></span>
            </div>
            <div class="detail-info-col">
                MOODS
                <span id="detailMood"></span>
            </div>
        </div>

        <div class="blog-content" id="detailContent"></div>
    </div>

    <!-- 글쓰기/수정 모달 -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Item</h3>
            <form id="postForm">
                <input type="hidden" id="postId">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="postTitle" required placeholder="Title">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Category (Multi)</label>
                        <select id="postCategory" multiple style="height: 120px;"></select>
                    </div>
                    <div class="form-group">
                        <label>Platform (Multi)</label>
                        <select id="postTags" multiple style="height: 120px;"></select>
                    </div>
                    <div class="form-group">
                        <label>Mood (Multi)</label>
                        <select id="postMoods" multiple style="height: 120px;"></select>
                    </div>
                    <button type="button" class="btn-recommend" onclick="autoRecommendTags()">자동 추천</button>
                </div>

                <div class="editor-wrapper">
                    <label>Content (Paste Image or URL)</label>
                    <div id="editor-container"></div>
                    <div class="image-resize-ui" id="resizeUI">
                        <input type="number" id="imgWidth"> <span style="color:#aaa;">×</span> <input type="number" id="imgHeight">
                        <button type="button" class="action-btn" id="imgApplyBtn">Set</button>
                        <div class="drag-handle" id="dragHandle">↔ Drag</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Thumbnail Cover</label>
                    <div id="thumbnailPicker" class="thumbnail-picker"></div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-modal-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 설정 (관리/백업) 모달 -->
    <div class="modal-overlay" id="manageModal">
        <div class="modal-content small">
            <h3>Settings</h3>
            <div class="manage-section">
                <h4>Categories</h4>
                <div class="manage-list" id="manageCategoryList"></div>
                <div class="add-input-group"><input type="text" id="newCategoryInput"><button type="button" onclick="addCategory()">Add</button></div>
            </div>
            <div class="manage-section">
                <h4>Platforms</h4>
                <div class="manage-list" id="managePlatformList"></div>
                <div class="add-input-group"><input type="text" id="newPlatformInput"><button type="button" onclick="addPlatform()">Add</button></div>
            </div>
            <div class="manage-section">
                <h4>Moods</h4>
                <div class="manage-list" id="manageMoodList"></div>
                <div class="add-input-group"><input type="text" id="newMoodInput"><button type="button" onclick="addMood()">Add</button></div>
            </div>
            <div class="manage-section" style="border-top: 1px solid var(--border-color); padding-top: 20px; display:flex; gap:10px;">
                <button type="button" class="btn-modal-cancel" onclick="exportData()">Export JSON</button>
                <button type="button" class="btn-modal-save" onclick="document.getElementById('importFile').click()">Import Data</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
            </div>
            <div class="modal-actions"><button type="button" class="btn-modal-save" onclick="closeManageModal()">Close</button></div>
        </div>
    </div>

    <!-- Quill Editor JS -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script>
        // ----------------------------------------------------
        // [테마 전환 로직 (다크 / 라이트 모드)]
        // ----------------------------------------------------
        const savedTheme = localStorage.getItem('designArchiveTheme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            document.getElementById('themeBtn').innerText = 'LIGHT';
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('designArchiveTheme', isDark ? 'dark' : 'light');
            document.getElementById('themeBtn').innerText = isDark ? 'LIGHT' : 'DARK';
        }

        // ----------------------------------------------------
        // [뷰 복귀 로직]
        // ----------------------------------------------------
        function restoreView() {
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('filterSection').style.display = 'block';
            document.getElementById('indexView').style.display = 'block';
        }

        // ----------------------------------------------------
        // [에디터 초기화]
        // ----------------------------------------------------
        var AlignStyle = Quill.import('attributors/style/align'); Quill.register(AlignStyle, true);
        var BaseImage = Quill.import('formats/image');
        class StyledImage extends BaseImage { static formats(domNode) { return { width: domNode.style.width, height: domNode.style.height }; } format(name, value) { if (name === 'width' || name === 'height') { if (value) this.domNode.style[name] = value; else this.domNode.style[name] = ''; } else super.format(name, value); } }
        Quill.register(StyledImage, true);
        var quill = new Quill('#editor-container', { theme: 'snow', modules: { toolbar: [ [{ 'header': [1, 2, 3, false] }], [{ 'align': [] }], ['bold', 'italic', 'underline'], ['link', 'image', 'video'], ['clean'] ] } });

        quill.root.addEventListener('paste', function(e) {
            if (e.clipboardData && e.clipboardData.items) { const items = e.clipboardData.items; for (let i = 0; i < items.length; i++) { if (items[i].type.indexOf('image') !== -1) { e.preventDefault(); const file = items[i].getAsFile(); const reader = new FileReader(); reader.onload = function(event) { const range = quill.getSelection(true) || {index: quill.getLength()}; quill.insertEmbed(range.index, 'image', event.target.result); quill.setSelection(range.index + 1); }; reader.readAsDataURL(file); return; } } }
            const text = (e.originalEvent || e).clipboardData.getData('text/plain').trim();
            if (/^https?:\/\/.+/.test(text)) { e.preventDefault(); const range = quill.getSelection(true) || {index: quill.getLength()}; quill.insertText(range.index, text, 'link', text); quill.setSelection(range.index + text.length); }
        });

        function updateThumbnailPicker() {
            const pk = document.getElementById('thumbnailPicker'); const div = document.createElement('div'); div.innerHTML = quill.root.innerHTML; const imgs = div.querySelectorAll('img');
            if(imgs.length === 0) { pk.innerHTML = '<span style="color:var(--text-muted); font-size:12px;">No images in content.</span>'; selectedThumbnail = ""; return; }
            pk.innerHTML = ''; let v = false;
            imgs.forEach((img, i) => {
                const el = document.createElement('img'); el.src = img.src; el.className = 'thumbnail-option';
                if(img.src === selectedThumbnail) { el.classList.add('selected'); v = true; } else if(i===0 && !selectedThumbnail) { el.classList.add('selected'); selectedThumbnail=img.src; v=true; }
                el.onclick = () => { document.querySelectorAll('.thumbnail-option').forEach(e=>e.classList.remove('selected')); el.classList.add('selected'); selectedThumbnail = img.src; };
                pk.appendChild(el);
            });
            if(!v && imgs.length>0) { pk.firstChild.classList.add('selected'); selectedThumbnail = imgs[0].src; }
        }
        quill.on('text-change', updateThumbnailPicker);

        // 리사이즈 로직
        const resizeUI = document.getElementById('resizeUI'); const imgW = document.getElementById('imgWidth'); const imgH = document.getElementById('imgHeight'); const dragBtn = document.getElementById('dragHandle');
        let activeImage = null;
        quill.root.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                if(activeImage) activeImage.classList.remove('active-resize'); activeImage = e.target; activeImage.classList.add('active-resize');
                const wrap = document.querySelector('.editor-wrapper').getBoundingClientRect(); const rect = activeImage.getBoundingClientRect();
                resizeUI.style.display = 'flex'; resizeUI.style.top = (rect.top - wrap.top - 50) + 'px'; resizeUI.style.left = (rect.left - wrap.left) + 'px';
                imgW.value = Math.round(activeImage.clientWidth); imgH.value = Math.round(activeImage.clientHeight);
            }
        });
        document.addEventListener('click', (e) => { if (activeImage && e.target !== activeImage && !resizeUI.contains(e.target)) { activeImage.classList.remove('active-resize'); resizeUI.style.display = 'none'; activeImage = null; } });
        document.getElementById('imgApplyBtn').onclick = () => { if(activeImage){ activeImage.style.width = imgW.value + 'px'; activeImage.style.height = imgH.value + 'px'; }};
        let isDragging = false, startX, startW, startH, ratio;
        dragBtn.addEventListener('mousedown', (e) => { if(!activeImage) return; isDragging = true; startX = e.clientX; startW = activeImage.clientWidth; startH = activeImage.clientHeight; ratio = startW / startH; e.preventDefault(); });
        document.addEventListener('mousemove', (e) => { if(isDragging && activeImage) { const w = Math.max(50, startW + (e.clientX - startX)); const h = w / ratio; activeImage.style.width = w+'px'; activeImage.style.height = h+'px'; imgW.value=Math.round(w); imgH.value=Math.round(h); } });
        document.addEventListener('mouseup', () => isDragging = false);

        function autoRecommendTags() {
            const txt = (document.getElementById('postTitle').value + " " + quill.getText()).toLowerCase();
            const dict = { 
                "photoshop": ["포토샵", "psd"], "illustrator": ["일러스트레이터", "일러", "ai"], "3d": ["blender", "블렌더", "c4d", "maya", "3d"], 
                "web design & development": ["웹디자인", "웹", "html"], "fashion": ["패션", "옷"], "typography": ["타이포그래피", "폰트"], 
                "music": ["음악", "뮤직"], "photography": ["사진", "카메라"],
                "귀여운": ["귀여운", "아기자기한", "큐트", "cute", "캐릭터"], "심플한": ["심플한", "단순한", "미니멀", "깔끔한"], "시크": ["시크한", "무채색", "블랙", "차분한", "모던"]
            };
            let count = 0; const check = (term) => { const lt = term.toLowerCase(); return txt.includes(lt) || (dict[lt] && dict[lt].some(s => txt.includes(s))); };
            Array.from(document.getElementById('postCategory').options).forEach(o => { if(!o.selected && check(o.value)) { o.selected = true; count++; } });
            Array.from(document.getElementById('postTags').options).forEach(o => { if(!o.selected && check(o.value)) { o.selected = true; count++; } });
            Array.from(document.getElementById('postMoods').options).forEach(o => { if(!o.selected && check(o.value)) { o.selected = true; count++; } });
            if(count>0) alert(`${count}개 항목이 자동 추천되었습니다.`); else alert(`추천할 수 있는 일치 항목이 없습니다.`);
        }

        // ----------------------------------------------------
        // [데이터 연동 및 다중 선택 렌더링 로직]
        // ----------------------------------------------------
        let masterCategories = JSON.parse(localStorage.getItem('designArchiveMultiCats')) || ["3D", "Books & Publication", "Fashion", "Music", "Resource", "Web Design & Development"];
        let masterPlatforms = JSON.parse(localStorage.getItem('designArchiveMultiPlats')) || ["Photoshop", "Illustrator", "AI", "Wed", "Reference"];
        let masterMoods = JSON.parse(localStorage.getItem('designArchiveMultiMoods')) || ["귀여운", "심플한", "시크"];
        
        const initialData = [
            { id: Date.now(), title: "ROUGHTYPE S/S Visual", category: ["Fashion"], thumbnail: "https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&q=80&w=800", tags: ["Art Direction", "Photography"], moods: ["시크"], content: "<p>테스트 콘텐츠</p>", pinned: false },
            { id: Date.now()-1000, title: "Bloomtide Brand Identity", category: ["Cosmetics", "3D"], thumbnail: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=800", tags: ["Creative Direction", "3D"], moods: ["심플한"], content: "<p>테스트 콘텐츠 2</p>", pinned: false }
        ];

        let posts = JSON.parse(localStorage.getItem('designArchiveAgencyV5')) || initialData;
        
        let activeCategories = [];
        let activePlatforms = [];
        let activeMoods = [];
        let currentDetailId = null, selectedThumbnail = "", searchQuery = "";

        function handleSearch() { searchQuery = document.getElementById('searchInput').value.trim().toLowerCase(); renderCards(); }
        
        function togglePin(id, event) {
            if(event) event.stopPropagation(); const post = posts.find(p => p.id === id);
            if(post) { post.pinned = !post.pinned; localStorage.setItem('designArchiveAgencyV5', JSON.stringify(posts)); renderCards(); if(currentDetailId === id) updateDetailPinBtn(post.pinned); }
        }
        function updateDetailPinBtn(isPinned) { document.getElementById('detailPinBtn').innerText = isPinned ? 'Unpin' : 'Pin'; }

        // --- 필터 및 액티브 태그 렌더링 ---
        function renderFiltersUI() {
            const catDiv = document.getElementById('categoryFilterList'); catDiv.innerHTML = '';
            masterCategories.forEach(cat => {
                const el = document.createElement('div'); el.className = 'filter-item'; 
                if(activeCategories.includes(cat)) el.classList.add('active'); 
                el.innerText = cat;
                el.onclick = () => { 
                    if (activeCategories.includes(cat)) activeCategories = activeCategories.filter(c => c !== cat); 
                    else activeCategories.push(cat); 
                    renderFiltersUI(); renderCards(); 
                };
                catDiv.appendChild(el);
            });
            
            const platDiv = document.getElementById('platformFilterList'); platDiv.innerHTML = '';
            masterPlatforms.forEach(plat => {
                const el = document.createElement('div'); el.className = 'filter-item'; 
                if(activePlatforms.includes(plat)) el.classList.add('active'); 
                el.innerText = plat;
                el.onclick = () => { 
                    if (activePlatforms.includes(plat)) activePlatforms = activePlatforms.filter(p => p !== plat); 
                    else activePlatforms.push(plat); 
                    renderFiltersUI(); renderCards(); 
                };
                platDiv.appendChild(el);
            });
            
            const moodDiv = document.getElementById('moodFilterList'); moodDiv.innerHTML = '';
            masterMoods.forEach(mood => {
                const el = document.createElement('div'); el.className = 'filter-item'; 
                if(activeMoods.includes(mood)) el.classList.add('active'); 
                el.innerText = mood;
                el.onclick = () => { 
                    if (activeMoods.includes(mood)) activeMoods = activeMoods.filter(m => m !== mood); 
                    else activeMoods.push(mood); 
                    renderFiltersUI(); renderCards(); 
                };
                moodDiv.appendChild(el);
            });

            const activeArea = document.getElementById('activeFiltersArea');
            activeArea.innerHTML = '';

            const createActiveTag = (type, val) => {
                const tag = document.createElement('div');
                tag.className = 'active-filter-tag';
                tag.innerHTML = `${val} <span class="remove-btn">✕</span>`;
                tag.onclick = () => {
                    if(type === 'cat') activeCategories = activeCategories.filter(c => c !== val);
                    if(type === 'plat') activePlatforms = activePlatforms.filter(p => p !== val);
                    if(type === 'mood') activeMoods = activeMoods.filter(m => m !== val);
                    renderFiltersUI(); renderCards();
                };
                activeArea.appendChild(tag);
            };

            activeCategories.forEach(c => createActiveTag('cat', c));
            activePlatforms.forEach(p => createActiveTag('plat', p));
            activeMoods.forEach(m => createActiveTag('mood', m));

            if(activeCategories.length > 0 || activePlatforms.length > 0 || activeMoods.length > 0) {
                const clearBtn = document.createElement('div');
                clearBtn.className = 'active-filter-tag clear-all';
                clearBtn.innerText = 'Clear All';
                clearBtn.onclick = resetFilters;
                activeArea.appendChild(clearBtn);
            }
        }

        function resetFilters() { activeCategories = []; activePlatforms = []; activeMoods = []; document.getElementById('searchInput').value=''; searchQuery=""; renderFiltersUI(); renderCards(); }
        
        // --- 카드 렌더링 ---
        function renderCards() {
            const indexGrid = document.getElementById('indexGrid');
            indexGrid.innerHTML = '';
            
            let filtered = posts.filter(post => {
                const cats = post.category || []; const tags = post.tags || []; const moods = post.moods || [];
                
                const matchC = activeCategories.length === 0 || activeCategories.some(c => cats.includes(c));
                const matchP = activePlatforms.length === 0 || activePlatforms.some(p => tags.includes(p));
                const matchM = activeMoods.length === 0 || activeMoods.some(m => moods.includes(m));
                
                let matchSearch = true;
                if(searchQuery) { const textDump = (post.title + " " + post.content + " " + cats.join(" ") + " " + tags.join(" ") + " " + moods.join(" ")).toLowerCase(); matchSearch = textDump.includes(searchQuery); }
                return matchC && matchP && matchM && matchSearch;
            });
            
            filtered.sort((a, b) => {
                const aPin = a.pinned ? 1 : 0; const bPin = b.pinned ? 1 : 0;
                if (aPin !== bPin) return bPin - aPin;
                return b.id - a.id; 
            });

            if(filtered.length === 0) { 
                indexGrid.innerHTML = `<div style="color:var(--text-muted); padding: 20px 0;">No items found.</div>`; 
                return; 
            }

            filtered.forEach(post => {
                const cats = (post.category||[]).join(', ');
                const tagsAndMoods = [...(post.tags||[]), ...(post.moods||[])].join(', ');
                const bg = post.thumbnail ? post.thumbnail : '';
                const pinMark = post.pinned ? '★' : '☆';
                
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showDetail(post.id);
                
                card.innerHTML = `
                    <div class="card-image" style="background-image: url('${bg}')">
                        <div class="pin-icon" onclick="togglePin(${post.id}, event)" title="Pin">${pinMark}</div>
                        <div class="card-actions">
                            <button class="action-btn" onclick="event.stopPropagation(); openModal(${post.id})">Edit</button>
                            <button class="action-btn" onclick="event.stopPropagation(); deletePost(${post.id})">Del</button>
                        </div>
                    </div>
                    <div class="card-tags">${cats ? cats + ' / ' : ''}${tagsAndMoods}</div>
                    <div class="card-title">${post.title}</div>
                `;
                indexGrid.appendChild(card);
            });
            localStorage.setItem('designArchiveAgencyV5', JSON.stringify(posts));
        }

        function showDetail(id) {
            currentDetailId = id; const post = posts.find(p => p.id === id); if(!post) return;
            document.getElementById('detailTitle').innerText = post.title;
            updateDetailPinBtn(post.pinned);
            
            document.getElementById('detailCat').innerText = (post.category||[]).join(', ') || '-';
            document.getElementById('detailPlat').innerText = (post.tags||[]).join(', ') || '-';
            document.getElementById('detailMood').innerText = (post.moods||[]).join(', ') || '-';
            
            document.getElementById('detailContent').innerHTML = post.content || "";
            document.getElementById('detailPinBtn').onclick = () => togglePin(id);
            document.getElementById('detailEditBtn').onclick = () => openModal(id);
            document.getElementById('detailDeleteBtn').onclick = () => deletePost(id);
            
            document.getElementById('filterSection').style.display = 'none';
            document.getElementById('indexView').style.display = 'none'; 
            document.getElementById('detailView').style.display = 'block'; 
            window.scrollTo(0, 0);
        }

        // --- 관리자 모달 ---
        function openManageModal() { document.getElementById('manageModal').style.display = 'flex'; renderManageLists(); }
        function closeManageModal() { document.getElementById('manageModal').style.display = 'none'; }
        function renderManageLists() {
            const catList = document.getElementById('manageCategoryList'); catList.innerHTML = ''; masterCategories.forEach((cat, idx) => { catList.innerHTML += `<div class="manage-item"><span>${cat}</span><div><button onclick="editCategory(${idx})">Edit</button> | <button onclick="deleteCategory(${idx})">Del</button></div></div>`; });
            const platList = document.getElementById('managePlatformList'); platList.innerHTML = ''; masterPlatforms.forEach((plat, idx) => { platList.innerHTML += `<div class="manage-item"><span>${plat}</span><div><button onclick="editPlatform(${idx})">Edit</button> | <button onclick="deletePlatform(${idx})">Del</button></div></div>`; });
            const moodList = document.getElementById('manageMoodList'); moodList.innerHTML = ''; masterMoods.forEach((mood, idx) => { moodList.innerHTML += `<div class="manage-item"><span>${mood}</span><div><button onclick="editMood(${idx})">Edit</button> | <button onclick="deleteMood(${idx})">Del</button></div></div>`; });
        }
        function saveData() { localStorage.setItem('designArchiveMultiCats', JSON.stringify(masterCategories)); localStorage.setItem('designArchiveMultiPlats', JSON.stringify(masterPlatforms)); localStorage.setItem('designArchiveMultiMoods', JSON.stringify(masterMoods)); localStorage.setItem('designArchiveAgencyV5', JSON.stringify(posts)); renderFiltersUI(); renderCards(); }
        
        function addCategory() { const v = document.getElementById('newCategoryInput').value.trim(); if(v && !masterCategories.includes(v)) { masterCategories.push(v); document.getElementById('newCategoryInput').value = ''; saveData(); renderManageLists(); } }
        function deleteCategory(idx) { if(confirm('Delete?')) { masterCategories.splice(idx, 1); saveData(); renderManageLists(); } }
        function editCategory(idx) { const o = masterCategories[idx]; const n = prompt('Edit:', o); if(n && n.trim() && n !== o) { masterCategories[idx] = n.trim(); posts.forEach(p => { const i = (p.category||[]).indexOf(o); if(i>-1) p.category[i] = n.trim(); }); saveData(); renderManageLists(); } }
        
        function addPlatform() { const v = document.getElementById('newPlatformInput').value.trim(); if(v && !masterPlatforms.includes(v)) { masterPlatforms.push(v); document.getElementById('newPlatformInput').value = ''; saveData(); renderManageLists(); } }
        function deletePlatform(idx) { if(confirm('Delete?')) { masterPlatforms.splice(idx, 1); saveData(); renderManageLists(); } }
        function editPlatform(idx) { const o = masterPlatforms[idx]; const n = prompt('Edit:', o); if(n && n.trim() && n !== o) { masterPlatforms[idx] = n.trim(); posts.forEach(p => { const i = (p.tags||[]).indexOf(o); if(i>-1) p.tags[i] = n.trim(); }); saveData(); renderManageLists(); } }

        function addMood() { const v = document.getElementById('newMoodInput').value.trim(); if(v && !masterMoods.includes(v)) { masterMoods.push(v); document.getElementById('newMoodInput').value = ''; saveData(); renderManageLists(); } }
        function deleteMood(idx) { if(confirm('Delete?')) { masterMoods.splice(idx, 1); saveData(); renderManageLists(); } }
        function editMood(idx) { const o = masterMoods[idx]; const n = prompt('Edit:', o); if(n && n.trim() && n !== o) { masterMoods[idx] = n.trim(); posts.forEach(p => { const i = (p.moods||[]).indexOf(o); if(i>-1) p.moods[i] = n.trim(); }); saveData(); renderManageLists(); } }

        function exportData() { const dataToExport = { categories: masterCategories, platforms: masterPlatforms, moods: masterMoods, posts: posts }; const jsonStr = JSON.stringify(dataToExport, null, 2); const blob = new Blob([jsonStr], { type: "application/json" }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `archive_backup_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url); }
        function importData(event) { const file = event.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = function(e) { try { const imp = JSON.parse(e.target.result); if(imp.posts && imp.categories) { if(confirm('Overwrite existing data?')) { masterCategories = imp.categories; masterPlatforms = imp.platforms || []; masterMoods = imp.moods || []; posts = imp.posts; saveData(); closeManageModal(); alert('Import complete.'); } } else alert('Invalid file.'); } catch(err) { alert('Error reading file.'); } event.target.value = ''; }; reader.readAsText(file); }

        // --- 글쓰기/수정 모달 ---
        const modal = document.getElementById('postModal'); const form = document.getElementById('postForm');
        function openModal(id = null) {
            modal.style.display = 'flex';
            const catSel = document.getElementById('postCategory'); const platSel = document.getElementById('postTags'); const moodSel = document.getElementById('postMoods');
            catSel.innerHTML = ''; platSel.innerHTML = ''; moodSel.innerHTML = '';
            masterCategories.forEach(c => { const o = document.createElement('option'); o.value = c; o.innerText = c; catSel.appendChild(o); });
            masterPlatforms.forEach(p => { const o = document.createElement('option'); o.value = p; o.innerText = p; platSel.appendChild(o); });
            masterMoods.forEach(m => { const o = document.createElement('option'); o.value = m; o.innerText = m; moodSel.appendChild(o); });
            
            if (id) {
                document.getElementById('modalTitle').innerText = 'Edit Item'; const post = posts.find(p => p.id === id);
                document.getElementById('postId').value = post.id; document.getElementById('postTitle').value = post.title; selectedThumbnail = post.thumbnail || "";
                const cats = post.category || []; Array.from(catSel.options).forEach(o => o.selected = cats.includes(o.value));
                const tags = post.tags || []; Array.from(platSel.options).forEach(o => o.selected = tags.includes(o.value));
                const moods = post.moods || []; Array.from(moodSel.options).forEach(o => o.selected = moods.includes(o.value));
                quill.root.innerHTML = post.content || ""; updateThumbnailPicker();
            } else {
                document.getElementById('modalTitle').innerText = 'Add Item'; form.reset(); document.getElementById('postId').value = ''; selectedThumbnail = "";
                Array.from(catSel.options).forEach(o => o.selected = false); Array.from(platSel.options).forEach(o => o.selected = false); Array.from(moodSel.options).forEach(o => o.selected = false);
                quill.root.innerHTML = ""; updateThumbnailPicker();
            }
        }
        function closeModal() { modal.style.display = 'none'; }
        form.addEventListener('submit', function(e) {
            e.preventDefault(); const id = document.getElementById('postId').value;
            const selCats = Array.from(document.getElementById('postCategory').selectedOptions).map(o => o.value);
            const selPlats = Array.from(document.getElementById('postTags').selectedOptions).map(o => o.value);
            const selMoods = Array.from(document.getElementById('postMoods').selectedOptions).map(o => o.value);
            let isPinned = false; if(id) { const exist = posts.find(p=>p.id == id); if(exist) isPinned = exist.pinned; }
            const newPost = { id: id ? Number(id) : Date.now(), title: document.getElementById('postTitle').value, category: selCats, tags: selPlats, moods: selMoods, thumbnail: selectedThumbnail, content: quill.root.innerHTML, pinned: isPinned };
            if (id) { const idx = posts.findIndex(p => p.id == id); posts[idx] = newPost; } else { posts.unshift(newPost); } 
            localStorage.setItem('designArchiveAgencyV5', JSON.stringify(posts)); closeModal(); renderCards();
            if(document.getElementById('detailView').style.display === 'block' && currentDetailId == id) showDetail(newPost.id);
        });
        function deletePost(id) { if(confirm("Delete this item?")) { posts = posts.filter(p => p.id !== id); localStorage.setItem('designArchiveAgencyV5', JSON.stringify(posts)); renderCards(); if(document.getElementById('detailView').style.display === 'block' && currentDetailId == id) restoreView(); } }

        // 초기 실행
        renderFiltersUI(); 
        renderCards();
    </script>
</body>
</html>
